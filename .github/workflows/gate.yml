name: gate

# CI-ворота R8: проверка версий, изолированного сервера и двух Flutter-приложений.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, integration/buyer-seller-r8-qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    name: версии
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RELEASE.json, pubspec и константы совпадают
        run: python tools/sync_version.py --check
      - name: Проверки синхронизации версий
        working-directory: tools
        run: python test_version.py
      - name: Релизный ZIP из чистого клона
        run: python tools/package_release.py "${{ runner.temp }}/sadohod_source_ci.zip"
      - name: Подписи версий в админке (JavaScript)
        working-directory: server/preview
        run: node test_build_label.cjs
      - name: Проверка JavaScript панели модерации
        working-directory: server/preview
        run: |
          node --check moderation.js
          node --check moderation-team.js

  server:
    name: сервер (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Серверные тесты на изолированной базе
        run: >
          docker compose -p sadohod_isolated_qa -f tools/compose.qa.yml
          up --build --abort-on-container-exit --exit-code-from tests
      - name: Очистить только QA-контейнеры
        if: always()
        run: docker compose -p sadohod_isolated_qa -f tools/compose.qa.yml down

  flutter:
    name: flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [seller_app, buyer_app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Analyze — warning и error блокируют сборку
        run: flutter analyze --no-fatal-infos
      - name: Flutter tests
        run: flutter test
      - name: Flutter Web build
        run: flutter build web --dart-define=API_BASE_URL=http://localhost:8000
      - name: Buyer demo in real iPhone SafeArea shell
        if: matrix.app == 'buyer_app'
        run: flutter build web --dart-define=USE_LOCAL_DEMO=true --dart-define=API_BASE_URL=http://localhost:8000
      - name: Save framed iPhone preview to check top inset
        if: matrix.app == 'buyer_app'
        uses: actions/upload-artifact@v4
        with:
          name: buyer-phone-shell
          path: buyer_app/build/web/
          retention-days: 3
      - name: Preview web build для визуальной проверки Figma
        run: flutter build web --dart-define=FIGMA_PREVIEW=true --dart-define=API_BASE_URL=http://localhost:8000
      - name: Сохранить Flutter Web для проверки в Chrome
        uses: actions/upload-artifact@v4
        with:
          name: figma-preview-${{ matrix.app }}
          path: ${{ matrix.app }}/build/web/
          retention-days: 3


  visual:
    name: Chrome screenshots (${{ matrix.app }})
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [seller_app, buyer_app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: figma-preview-${{ matrix.app }}
          path: preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: python -m pip install playwright==1.56.0 pillow==11.3.0
      - name: Real Chrome screenshots at iPhone 16 Pro width
        run: python tools/visual_smoke.py --app ${{ matrix.app }} --build preview --output chrome-screenshots
      - name: Save screenshots for manual visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-screenshots-${{ matrix.app }}
          path: chrome-screenshots/
          if-no-files-found: warn
          retention-days: 7


  buyer_phone_shell:
    name: Chrome iPhone shell (buyer header)
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: buyer-phone-shell
          path: preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser screenshot dependencies
        run: python -m pip install playwright==1.56.0 pillow==11.3.0
      - name: Verify true iPhone 16 Pro inset and pinned home header
        run: python tools/visual_smoke.py --app buyer_shell --build preview --output chrome-screenshots
      - name: Upload buyer full device screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-screenshots-buyer-phone-shell
          path: chrome-screenshots/
          if-no-files-found: warn
          retention-days: 7


  buyer_device_matrix:
    name: Chrome device matrix (buyer)
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: buyer-phone-shell
          path: preview
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: python -m pip install playwright==1.56.0 pillow==11.3.0
      - name: Screenshot compact, uncommon Android and iPhone QA profiles
        run: python tools/visual_smoke.py --app buyer_matrix --build preview --output chrome-device-matrix
      - name: Archive device-matrix screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-device-matrix-buyer
          path: chrome-device-matrix/
          if-no-files-found: warn
          retention-days: 7

  buyer_native:
    name: buyer native build
    uses: ./.github/workflows/buyer-native.yml

  seller_native:
    name: seller native build
    uses: ./.github/workflows/seller-native.yml

  gate:
    name: ворота
    if: always()
    needs: [versions, server, flutter, visual, buyer_phone_shell, buyer_device_matrix, buyer_native, seller_native]
    runs-on: ubuntu-latest
    steps:
      - name: Проверить результат всех заданий
        env:
          VERSIONS: ${{ needs.versions.result }}
          SERVER: ${{ needs.server.result }}
          FLUTTER: ${{ needs.flutter.result }}
          VISUAL: ${{ needs.visual.result }}
          PHONE_SHELL: ${{ needs.buyer_phone_shell.result }}
          DEVICE_MATRIX: ${{ needs.buyer_device_matrix.result }}
          BUYER_NATIVE: ${{ needs.buyer_native.result }}
          SELLER_NATIVE: ${{ needs.seller_native.result }}
        run: |
          echo "versions: $VERSIONS"
          echo "server:   $SERVER"
          echo "flutter:  $FLUTTER"
          echo "visual:   $VISUAL"
          echo "phone:    $PHONE_SHELL"
          echo "matrix:   $DEVICE_MATRIX"
          echo "buyer-native:  $BUYER_NATIVE"
          echo "seller-native: $SELLER_NATIVE"
          test "$VERSIONS" = success
          test "$SERVER" = success
          test "$FLUTTER" = success
          test "$VISUAL" = success
          test "$PHONE_SHELL" = success
          test "$DEVICE_MATRIX" = success
          test "$BUYER_NATIVE" = success
          test "$SELLER_NATIVE" = success
