name: Restore exact Manrope files
on:
  push:
    branches: [fix/manrope-only-font-family]
    paths: ['.github/workflows/restore-exact-manrope.yml']
  pull_request:
    branches: [develop]
    paths: ['.github/workflows/restore-exact-manrope.yml']
permissions:
  contents: write
jobs:
  restore-fonts:
    if: github.event_name == 'push' || github.head_ref == 'fix/manrope-only-font-family'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reconstruct and verify exact user-provided fonts
        shell: python
        run: |
          import base64
          import hashlib
          import io
          import pathlib
          import struct
          import urllib.request
          import zipfile
          expected = {"Manrope-ExtraLight.ttf":"f582541204bdc68b51de3c2fe50b99ec20c3c0319692177cbf427719929aa916","Manrope-Light.ttf":"d846bf4ff042a2d9ff27109aeaf64228c94d88ab6cf7ba4ac6bacff018e73f34","Manrope-Regular.ttf":"6383bd9f81e56d61139884d8e42cb7b2146a11dde4efde55c8bff1e4c2c0bbe8","Manrope-Medium.ttf":"88d3f8ef004b53483a202772d09acaab17ca99dd41905d9b4ab07ac635632378","Manrope-SemiBold.ttf":"abbefa1f58c7355b663c19f29ffe4cd7fc8c93a9e5f8b68f08d1e9ba2bc4ba0d","Manrope-Bold.ttf":"4aed5d180a4f41ed21f07e678486f889bb40eb0ddf5f473769b6302f507d1e36","Manrope-ExtraBold.ttf":"5be6d9b21d23981ab520f0bfc7800c434c9d093467ef24b85b16877e7709b03b"}
          patches = {"Manrope-Bold.ttf":[["AAQEzAK8AAUAAAUUBLAAAACWBRQEsAAAArwAMgKIAAAAAAAAAAAAAAAAoAACv1AAIGsAAAAAAAAAAFNITUkAoAAN+wIIVP2oAAAIVAJYIAABnwAAAAAEOAWgAAAAIAAE",2491971661],["AAEAAAAEgQZ0cRR6Xw889QADB9AAAAAA27amhAAAAADdH1Gf/s/9ngnICWQAAQAGAAIAAAAA",545834230]],"Manrope-ExtraBold.ttf":[["AAQE3wMgAAUAAAUUBLAAAACWBRQEsAAAArwAMgKIAAAAAAAAAAAAAAAAoAACv1AAIGsAAAAAAAAAAFNITUkAwAAN+wIIVP2oAAAIVAJYIAABnwAAAAAEOAWgAAAAIAAE",2498525312],["AAEAAAAEgQZgbxqgXw889QADB9AAAAAA27amhAAAAADdH1Gf/uL9ignECZsAAAAGAAIAAAAA",546751769]],"Manrope-ExtraLight.ttf":[["AAQEaQD6AAUAAAUUBLAAAACWBRQEsAAAArwAMgKIAAAAAAAAAAAAAAAAoAACv1AAIGsAAAAAAAAAAFNITUkAwAAN+wIIVP2oAAAIVAJYIAABnwAAAAAEOAWgAAAAIAAE",2462480394],["AAEAAAAEgQZ69+FiXw889QADB9AAAAAA27amhAAAAADdH1Gf/nD+AgncCFQAAAAGAAIAAAAA",540853322]],"Manrope-Light.ttf":[["AAQEfQEsAAUAAAUUBLAAAACWBRQEsAAAArwAMgKIAAAAAAAAAAAAAAAAoAACv1AAIGsAAAAAAAAAAFNITUkAwAAN+wIIVP2oAAAIVAJYIAABnwAAAAAEOAWgAAAAIAAE",2465757214],["AAEAAAAEgQb0ErVEXw889QADB9AAAAAA27amhAAAAADdH1Gf/oP97gnYCIsAAAAGAAIAAAAA",541836397]],"Manrope-Medium.ttf":[["AAQEpAH0AAUAAAUUBLAAAACWBRQEsAAAArwAMgKIAAAAAAAAAAAAAAAAoAACv1AAIGsAAAAAAAAAAFNITUkAwAAN+wIIVP2oAAAIVAJYIAABnwAAAAAEOAWgAAAAIAAE",2478864453],["AAEAAAAEgQYgS8xGXw889QADB9AAAAAA27amhAAAAADdH1Gf/qn9xgnQCPgAAAAGAAIAAAAA",543802546]],"Manrope-Regular.ttf":[["AAQEkQGQAAUAAAUUBLAAAACWBRQEsAAAArwAMgKIAAAAAAAAAAAAAAAAoAACv1AAIGsAAAAAAAAAAFNITUkAwAAN+wIIVP2oAAAIVAJYIAABnwAAAAAEOAWgAAAAIAAE",2472310834],["AAEAAAAEgQansYewXw889QADB9AAAAAA27amhAAAAADdH1Gf/pb92gnUCMEAAAAGAAIAAAAA",542819471]],"Manrope-SemiBold.ttf":[["AAQEuAJYAAUAAAUUBLAAAACWBRQEsAAAArwAMgKIAAAAAAAAAAAAAAAAoAACv1AAIGsAAAAAAAAAAFNITUkAwAAN+wIIVP2oAAAIVAJYIAABnwAAAAAEOAWgAAAAIAAE",2485418073],["AAEAAAAEgQZbNRlWXw889QADB9AAAAAA27amhAAAAADdH1Gf/rz9sgnMCS4AAAAGAAIAAAAA",544785620]]}
          url = 'https://raw.githubusercontent.com/dangphuc2611/ASM_HTML/master/Manrope.zip'
          with urllib.request.urlopen(url, timeout=45) as response:
              downloaded = response.read()
          archive = zipfile.ZipFile(io.BytesIO(downloaded))
          directory = pathlib.Path('shared/flutter_core/assets/fonts')
          directory.mkdir(parents=True, exist_ok=True)
          for filename, target_hash in expected.items():
              payload = bytearray(archive.read('static/' + filename))
              original_length = len(payload)
              sfnt_tables = {}
              count = struct.unpack_from('>H', payload, 4)[0]
              for index in range(count):
                  record_offset = 12 + index * 16
                  tag, checksum, offset, length = struct.unpack_from('>4sIII', payload, record_offset)
                  sfnt_tables[tag.decode('ascii')] = (record_offset, offset, length)
              for tag, (encoded_data, checksum) in zip(('OS/2','head'), patches[filename]):
                  replacement = base64.b64decode(encoded_data)
                  record_offset, offset, length = sfnt_tables[tag]
                  assert len(replacement) == length, (filename, tag, len(replacement), length)
                  payload[offset:offset+length] = replacement
                  struct.pack_into('>I', payload, record_offset+4, checksum)
              assert len(payload) == original_length
              digest = hashlib.sha256(payload).hexdigest()
              if digest != target_hash:
                  raise SystemExit(f'REFUSED: exact original hash mismatch {filename}: {digest} != {target_hash}')
              (directory / filename).write_bytes(payload)
              print(f'EXACT USER ARCHIVE VERIFIED: {filename} {digest}')
      - name: Commit verified TTF files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/flutter_core/assets/fonts/Manrope-*.ttf
          if ! git diff --cached --quiet; then
            git commit -m "fix(fonts): install byte-exact Manrope from supplied archive"
            git push
          fi
