name: sadohod_shared_core
description: Common API connection settings for the buyer and seller Flutter clients.
publish_to: none
version: 0.8.4+27
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  share_plus: 13.3.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.0

# Shared font for both apps, bundled for offline usage (SIL OFL 1.1).
flutter:
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
