name: sadohod_shared_core
description: Common API connection settings for the buyer and seller Flutter clients.
publish_to: none
version: 0.8.4+27
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.0

# Fonts are bundled once in the shared package and reused by both clients.
flutter:
  fonts:
    - family: Helvetica
      fonts:
        - asset: assets/fonts/Helvetica.ttf
          weight: 400
        - asset: assets/fonts/Helvetica-Bold.ttf
          weight: 700
        - asset: assets/fonts/Helvetica-Oblique.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Helvetica-BoldOblique.ttf
          weight: 700
          style: italic
