name: sadohod
description: Sadohod - visual discovery of products at the Sadovod market (MVP demo)
publish_to: 'none'
version: 0.8.4+27

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  sadohod_shared_core:
    path: ../shared/flutter_core
  flutter:
    sdk: flutter
  go_router: ^17.5.0
  image_picker: ^1.2.3
  file_picker: ^8.3.7
  camera: ^0.11.2
  http: ^1.6.0
  flutter_svg: ^2.2.0
  shared_preferences: ^2.5.0
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/products/
    - assets/figma/
