# Public staging/production overlay. Use with docker-compose.yml + docker-compose.ml.yml.
# Same service image and persistent pgvector/media/admin volumes; no local data is moved.
# Only Caddy exposes public ports. Leave SADOHOD_BIND unset in the env file.
# Never reuse the local Windows Compose project/volumes.
name: sadohod_public
services:
  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in the environment file}
  api:
    restart: unless-stopped
    environment:
      SADOHOD_ENV: ${SADOHOD_ENV:-staging}
      DEMO_SEED: "0"
      DATABASE_URL: postgresql+psycopg://sadohod:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@db:5432/sadohod
      SEARCH_BACKEND: clip
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      PHOTO_SEARCH_MIN_SCORE: ${PHOTO_SEARCH_MIN_SCORE:-0.20}
      # Caddy normalizes X-Forwarded-For; API must see the real client IP
      # or all buyers share one 20-requests/minute photo-search rate limit.
      # Never expose api:8000 publicly while this is enabled.
      FORWARDED_ALLOW_IPS: "*"
    volumes:
      - sadohod_ml_cache:/root/.cache
  https:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set your API_DOMAIN without https prefix}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./https/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - sadohod_public_caddy_data:/data
      - sadohod_public_caddy_config:/config
    depends_on:
      - api
volumes:
  sadohod_ml_cache:
  sadohod_public_caddy_data:
  sadohod_public_caddy_config:
