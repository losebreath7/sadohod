<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Садоход — модерация продавцов</title><link rel="stylesheet" href="merchant.css"></head><body><main class="layout"><header><div class="brand">САДОХОД <span>/ МОДЕРАЦИЯ</span></div><a href="/preview/merchant.html">Кабинет продавца</a></header><div class="heading"><div><p class="eyebrow">АДМИНИСТРИРОВАНИЕ</p><h1>Очередь модерации</h1><p class="muted">Заявки, павильоны, товары и предложения. Только для локального администратора.</p></div></div><div id="message" class="notice" hidden></div><section class="card" id="access"><form id="authForm" class="stack"><label>Код администратора<input id="adminKey" type="password" autocomplete="off" required></label><button>Открыть очередь</button></form></section><section id="content" hidden><div class="bar"><h2>Заявки</h2><button class="secondary" id="refresh">Обновить</button></div><div id="applications" class="list"></div><h2>Павильоны</h2><div id="pavilions" class="list"></div><h2>Товары</h2><div id="products" class="list"></div><h2>Новые предложения</h2><div id="listings" class="list"></div><div class="card"><h3>Приглашение продавца</h3><form id="invite" class="grid-form"><label>Email продавца<input name="email" type="email" required></label><label>Название магазина<input name="shop_name" required minlength="2"></label><label>Контакт<input name="contact"></label><label>Сектор<input name="zone" required></label><label>Павильон<input name="code" required></label><button>Создать приглашение</button></form><div id="inviteResult" class="notice" hidden></div></div></section><footer><span data-build-label></span>. Код администратора не сохраняется в браузере.</footer></main><script src="merchant_admin.js" defer></script><script src="build_info.js"></script><script src="build_label.js"></script></body></html>
