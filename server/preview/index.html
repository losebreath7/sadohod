<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Садоход — интерактивный прототип 0.1</title>
<style>
:root {--ink:#151515;--mute:#7a7a77;--bg:#fafaf8;--border:#e5e5e0;--tile:#f1f1ed}
*{box-sizing:border-box} body{margin:0;background:#e9e9e6;color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
.phone{margin:28px auto;background:var(--bg);max-width:440px;min-height:min(850px,calc(100dvh - 56px));height:calc(100dvh - 56px);overflow:hidden;display:flex;flex-direction:column;border-radius:22px;box-shadow:0 25px 70px #00000010;position:relative}
main{overflow-y:auto;flex:1;overscroll-behavior:contain} main::-webkit-scrollbar{width:4px} main::-webkit-scrollbar-thumb{background:#d3d3ce;border-radius:3px}
.header{display:flex;align-items:center;justify-content:space-between;padding:23px 22px 0}.brand{font-size:25px;font-weight:800;letter-spacing:-1.5px;border:0;background:transparent;cursor:pointer;padding:0;color:var(--ink)} .tag,.over{font-size:10px;font-weight:700;color:var(--mute);letter-spacing:1.7px}.content{padding:33px 22px 40px}.pagehead{font-size:43px;letter-spacing:-2px;line-height:1.05;font-weight:750;margin:16px 0 18px}.sub{font-size:14px;line-height:1.55;color:var(--mute);margin:0 0 24px} .feature{height:204px;border-radius:9px;background:var(--ink);color:white;padding:22px;display:flex;flex-direction:column;justify-content:space-between;border:0;width:100%;text-align:left;cursor:pointer}.featuretop{display:flex;justify-content:space-between;font-size:36px;font-weight:300}.feature small{color:#aaa;letter-spacing:1.4px;font-weight:700;font-size:10px}.feature strong{display:block;font-size:21px;margin-top:12px;letter-spacing:-.5px}.section{display:flex;align-items:center;justify-content:space-between;margin:32px 0 15px}.link{border:none;background:none;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer}.chips{display:flex;overflow-x:auto;gap:7px;scrollbar-width:none}.chip{border:1px solid var(--border);background:white;white-space:nowrap;border-radius:7px;padding:12px 15px;font-size:12px;cursor:pointer;color:var(--ink)}.chip.active{color:white;background:var(--ink);border-color:var(--ink)}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}.card{cursor:pointer;min-width:0}.card img{display:block;width:100%;aspect-ratio:.86;object-fit:cover;border-radius:6px;background:var(--tile)}.price{font-size:17px;font-weight:750;letter-spacing:-.4px;margin-top:10px}.name{font-size:12px;margin-top:5px;line-height:1.35}.category{font-size:11px;color:var(--mute);margin-top:3px}.notice{border-radius:7px;background:#f0f0ec;padding:14px;color:var(--mute);font-size:12px;line-height:1.45;display:flex;gap:9px;margin-top:20px}.nav{display:grid;grid-template-columns:1fr 1fr;height:76px;border-top:1px solid var(--border);background:var(--bg);flex-shrink:0}.nav button{background:transparent;border:0;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer}.nav button.active{color:var(--ink);font-weight:700}.nav button span{font-size:23px;font-weight:300;line-height:1}.topbar{padding:21px 22px 16px;display:flex;align-items:center;gap:16px;font-weight:700;font-size:15px}.back{border:0;background:transparent;color:var(--ink);font-size:24px;cursor:pointer;padding:0}.searchinput{font-size:14px;border:1px solid var(--border);padding:17px;border-radius:8px;width:100%;background:white;outline:0;color:var(--ink)}.searchinput:focus{border-color:var(--ink)}.count{font-size:12px;color:var(--mute)}.upload{height:300px;border:1px solid var(--border);border-radius:9px;background:var(--tile);display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden;text-align:center;color:var(--mute);font-size:12px;gap:14px}.upload svg{width:42px;height:42px}.upload img{height:100%;max-width:100%;object-fit:contain}.uploadbtns{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:17px}.outline{background:white;border:1px solid var(--border);border-radius:9px;min-height:50px;cursor:pointer;font-weight:600;color:var(--ink);font-size:13px}.primary{background:var(--ink);color:white;border:none;border-radius:9px;width:100%;height:58px;text-align:left;padding:0 20px;display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:15px;cursor:pointer}.primary:disabled{background:#a4a4a1;cursor:not-allowed}.selected{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:8px;padding:11px;background:white}.selected img{width:72px;height:78px;object-fit:cover;border-radius:5px}.selected p{margin:8px 0 0;font-size:14px;font-weight:600}.imageFull{width:100%;aspect-ratio:1;object-fit:cover}.divider{height:1px;background:var(--border);margin:25px 0}.location{background:var(--ink);color:white;padding:19px;border-radius:9px;margin:17px 0 30px}.sellerbox{border:1px solid var(--border);border-radius:8px;padding:17px;background:white;display:flex;align-items:center;gap:15px;text-align:left;width:100%;cursor:pointer}.smallhint{color:var(--mute);font-size:12px;line-height:1.5}.empty{padding:60px 0;text-align:center;color:var(--mute)}
@media(max-width:500px){body{background:var(--bg)}.phone{margin:0;max-width:none;height:100dvh;min-height:100dvh;border-radius:0;box-shadow:none}.header{padding-top:max(22px,env(safe-area-inset-top))}.nav{padding-bottom:env(safe-area-inset-bottom);height:calc(73px + env(safe-area-inset-bottom))}}
</style></head>
<body><div class="phone"><main id="view"></main><nav class="nav" id="nav"></nav></div><input type="file" id="file" accept="image/*" hidden>
<script>
const products=[
['p01','Укороченная куртка','Верхняя одежда',3890,'s01'],['p02','Сумка с короткими ручками','Сумки',2450,'s02'],['p03','Футболка свободного кроя','Одежда',990,'s03'],['p04','Кроссовки на платформе','Обувь',2990,'s04'],['p05','Худи с карманом','Одежда',2690,'s02'],['p06','Прямые брюки','Одежда',1990,'s01'],['p07','Платье миди','Платья',3190,'s03'],['p08','Куртка с воротником','Верхняя одежда',4290,'s04'],['p09','Мини-сумка','Сумки',1890,'s02'],['p10','Кеды низкие','Обувь',2190,'s03'],['p11','Футболка базовая','Одежда',1190,'s01'],['p12','Брюки широкие','Одежда',2590,'s04']];
const sellers={s01:['Контур 01','А-14','Сектор А · линия 2'],s02:['Студия 08','Б-08','Сектор Б · линия 1'],s03:['Форма 17','В-17','Сектор В · линия 4'],s04:['Линия 05','Г-05','Сектор Г · линия 3']};
const cats=['Все','Верхняя одежда','Одежда','Обувь','Сумки','Платья'];let route='home',activeCategory='Все',q='',image=null;const view=document.getElementById('view'),nav=document.getElementById('nav');
const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';const pimage=p=>`assets/${p[0]}.jpg`;const head=()=>`<header class="header"><button class="brand" onclick="go('home')">садоход.</button><span class="tag">ДЕМО / 0.1</span></header>`;
const notice=(s='Демонстрационный каталог: товары, цены и павильоны вымышлены.')=>`<div class="notice"><span>ⓘ</span><span>${s}</span></div>`;
const card=p=>`<div class="card" role="button" tabindex="0" onclick="go('product:${p[0]}')"><img src="${pimage(p)}" alt="Демонстрационное изображение"><div class="price">${money(p[3])}</div><div class="name">${p[1]}</div><div class="category">${p[2]}</div></div>`;
const grid=ps=>ps.length?`<div class="products">${ps.map(card).join('')}</div>`:`<div class="empty">Ничего не нашлось.<br>Попробуйте другой запрос.</div>`;
const chips=mode=>`<div class="chips">${cats.slice(mode==='home'?1:0).map(c=>`<button class="chip ${activeCategory===c&&mode!=='home'?'active':''}" onclick="selectCategory(decodeURIComponent('${encodeURIComponent(c)}'))">${c}</button>`).join('')}</div>`;
let navStack=[];function go(next){if(route!==next)navStack.push(route);route=next;render();view.scrollTop=0;history.replaceState(null,'','#'+encodeURIComponent(route))}
function selectCategory(c){activeCategory=c;if(route==='home')go('catalog');else render()}
function filter(){q=document.getElementById('query')?.value||'';const caret=document.getElementById('query')?.selectionStart;render();document.getElementById('query')?.focus();document.getElementById('query')?.setSelectionRange(caret,caret)}
function navbar(){const visible=['home','catalog'].includes(route);nav.style.display=visible?'grid':'none';nav.innerHTML=visible?`<button class="${route==='home'?'active':''}" onclick="go('home')"><span>⌗</span>Поиск</button><button class="${route==='catalog'?'active':''}" onclick="go('catalog')"><span>▦</span>Каталог</button>`:''}
function toolbar(title){return `<div class="topbar"><button class="back" onclick="historyBack()">←</button><span>${title}</span></div>`}
function historyBack(){route=navStack.pop()||'home';render();view.scrollTop=0}
function render(){navbar();let html='';
if(route==='home') html=head()+`<div class="content"><div class="over">ТВОЙ ПОИСК / МОСКВА</div><h1 class="pagehead">Нашёл вещь?<br>Найди её<br>на Садоводе.</h1><p class="sub">Покажи фотографию — узнавай, в каком павильоне искать похожий товар.</p><button class="feature" onclick="go('search')"><div class="featuretop"><span>⌗</span><span>↗</span></div><div><small>ПОИСК ПО ИЗОБРАЖЕНИЮ</small><strong>Загрузить фотографию</strong></div></button><div class="section"><div class="over">ПОСМОТРЕТЬ КАТАЛОГ</div><button class="link" onclick="activeCategory='Все';go('catalog')">Все товары ↗</button></div>${chips('home')}<div class="section"><div class="over">ПОДБОРКА / ДЕМО</div></div>${grid(products.slice(0,4))}${notice()}</div>`;
else if(route==='catalog'){const ps=products.filter(p=>(activeCategory==='Все'||p[2]===activeCategory)&&(!q||p[1].toLowerCase().includes(q.toLowerCase())||p[2].toLowerCase().includes(q.toLowerCase())));html=head()+`<div class="content"><div class="over">САДОВОД / КАТАЛОГ</div><h1 class="pagehead">Каталог</h1><input class="searchinput" id="query" value="${q.replaceAll('"','&quot;')}" oninput="filter()" placeholder="Найти по названию"><div style="height:19px"></div>${chips('catalog')}<div class="section"><span class="count">Товаров: ${ps.length}</span><button class="link" onclick="go('search')">⌗ По фото</button></div>${grid(ps)}${notice()}</div>`}
else if(route==='search')html=toolbar('Поиск по фото')+`<div class="content" style="padding-top:18px"><div class="over">ШАГ 01 / ИЗОБРАЖЕНИЕ</div><h1 class="pagehead" style="font-size:36px">Что ищем?</h1><p class="sub">Загрузи фотографию вещи или скриншот. Позже здесь появится поиск похожих товаров в каталоге.</p><div class="upload">${image?`<img src="${image}" alt="Выбранная фотография">`:`<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="10" width="38" height="30" rx="3"/><circle cx="17" cy="20" r="4"/><path d="M6 34l11-10 8 7 7-8 11 12"/></svg>Здесь появится твоя фотография`}</div><div class="uploadbtns"><button class="outline" onclick="document.getElementById('file').click()">▧ &nbsp; Из галереи</button><button class="outline" onclick="document.getElementById('file').click()">◎ &nbsp; Камера / файл</button></div><div style="height:25px"></div><button class="primary" ${image?'':'disabled'} onclick="go('results')">Посмотреть демо-выдачу <span>→</span></button>${notice('В версии 0.1 фото выбирается локально, но не анализируется. Следующий этап — поиск по изображениям через сервер.')}</div>`;
else if(route==='results')html=toolbar('Результаты')+`<div class="content" style="padding-top:17px"><div class="over">ШАГ 02 / ВЫДАЧА</div><h1 class="pagehead" style="font-size:36px">Вот что есть<br>в каталоге.</h1><div class="selected"><img src="${image||pimage(products[0])}" alt="Запрос"><div><span class="over">ТВОЙ ЗАПРОС</span><p>Фотография загружена</p></div><button class="link" onclick="go('search')" style="margin-left:auto;font-size:24px">↻</button></div>${notice('Это примеры товаров, а НЕ результат распознавания фотографии. Сходство пока не вычисляется.')}<div class="section"><div class="over">ТОВАРЫ ИЗ ДЕМО-КАТАЛОГА</div><span class="count">12 шт.</span></div>${grid(products)}</div>`;
else if(route.startsWith('product:')){const p=products.find(x=>x[0]===route.split(':')[1]);if(!p)return go('catalog');const s=sellers[p[4]];html=toolbar('Товар')+`<img class="imageFull" src="${pimage(p)}" alt="${p[1]}"><div class="content" style="padding-top:24px"><div class="over">${p[2].toUpperCase()}</div><h1 class="pagehead" style="font-size:30px;line-height:1.1">${p[1]}</h1><div style="font-weight:750;font-size:27px">${money(p[3])}</div><div class="divider"></div><div class="over">О ТОВАРЕ</div><p class="sub" style="color:var(--ink);margin-top:13px">Демонстрационный товар. Детальные характеристики и фактическое наличие появятся после подключения продавцов.</p><div class="section"><span class="over">ГДЕ НАЙТИ</span></div><button class="sellerbox" onclick="go('seller:${p[4]}')"><span style="font-size:26px">▤</span><span style="flex:1"><strong>${s[0]}</strong><br><span class="smallhint">${s[2]} · пав. ${s[1]}</span></span><span>→</span></button>${notice()}</div>`}
else if(route.startsWith('seller:')){const id=route.split(':')[1],s=sellers[id];if(!s)return go('catalog');html=toolbar('Продавец')+`<div class="content"><div class="over">ТОРГОВАЯ ТОЧКА / ДЕМО</div><h1 class="pagehead" style="font-size:36px">${s[0]}</h1><div class="location"><strong style="font-size:18px">⌖ &nbsp; ПАВИЛЬОН ${s[1]}</strong><div style="color:#bbb;font-size:13px;margin-top:8px">${s[2]}</div></div><div class="over" style="margin-bottom:15px">ТОВАРЫ ПРОДАВЦА</div>${grid(products.filter(p=>p[4]===id))}${notice()}</div>`}
view.innerHTML=html;}
document.getElementById('file').addEventListener('change',e=>{const file=e.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Выберите изображение');return}if(file.size>10*1024*1024){alert('Файл должен быть меньше 10 МБ');return}if(image)URL.revokeObjectURL(image);image=URL.createObjectURL(file);render()});
render();
</script></body></html>
